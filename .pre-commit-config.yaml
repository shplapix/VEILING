repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy-backend
        name: mypy backend strict
        entry: uv run --directory backend mypy --strict app tests
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-backend
        name: pytest backend
        entry: uv run --directory backend pytest
        language: system
        types: [python]
        pass_filenames: false

      - id: eslint-frontend
        name: eslint frontend
        entry: npm --prefix frontend run lint
        language: system
        pass_filenames: false

      - id: typecheck-frontend
        name: typecheck frontend
        entry: npm --prefix frontend run typecheck
        language: system
        pass_filenames: false
